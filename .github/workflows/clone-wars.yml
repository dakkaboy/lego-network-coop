name: Clone Wars x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clone-wars:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/lego-star-wars-iii
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Zig 0.17.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-0.17.1.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e') { throw 'Zig archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.1') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test
        shell: pwsh
        run: |
          zig build dll test-all --prefix build/native -j6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
