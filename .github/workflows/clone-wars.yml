name: Clone Wars x86

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clone-wars:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/lego-star-wars-iii
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_DIR=%%i"
          if not defined VS_DIR exit /b 1
          call "%VS_DIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake --preset windows-x86 -DCLONEWARS_NETWORK_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build build
          if errorlevel 1 exit /b 1
          ctest --test-dir build --output-on-failure
